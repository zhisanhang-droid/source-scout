source_id: mcp_registries
name: MCP Registries and Tool Directories
source_type: tool_registry
status: watch
priority: 4
best_for:
  - Finding ready-made AI-callable tools and servers.
  - Discovering whether a platform already has an MCP wrapper.
  - Comparing local vs hosted access patterns.
not_good_for:
  - Proving data quality.
  - Confirming long-term maintenance without GitHub follow-up.
domain_fit:
  ecommerce: 3
  engineering: 4
  consumer_feedback: 1
  data_collection: 4
  ai_tools: 5
access_methods:
  - method_id: registry_search
    description: Search public MCP registries, GitHub, and tool directories for platform and data-source names.
    speed: medium
    reliability: 3
    notes:
      - Registry landscape changes quickly; follow repository links.
query_patterns:
  - '{platform} MCP server'
  - '{platform} mcp github'
  - '{domain} mcp tools'
  - '{data_source} model context protocol'
source_discovery_patterns:
  - 'MCP registry {domain}'
  - 'awesome mcp servers {domain}'
quality_signals:
  strong:
    - Clear transport, auth, tool schema, and recent maintenance.
    - Works with local credentials or browser/session model if needed.
  weak:
    - Demo-only server.
    - No auth story.
failure_modes:
  - Many MCP servers are early, abandoned, or shallow wrappers.
maintenance:
  check_frequency: monthly
  last_checked: 2026-08-09
  known_failures: []
history:
  - date: 2026-08-09
    task: Source Scout design
    access_method: registry_search
    result_quality: medium
    feedback: Track as a fast-moving source type; verify through GitHub and local tests.

