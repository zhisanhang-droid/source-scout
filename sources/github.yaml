source_id: github
name: GitHub
source_type: code_hosting_ecosystem
status: active
priority: 5
best_for:
  - Open-source implementations and prior art.
  - Engineering workarounds hidden in Issues, PRs, Discussions, and code.
  - Tool maintenance health and failure patterns.
  - Discovering related projects through topics, stars, forks, and README links.
not_good_for:
  - Consumer sentiment.
  - Market size.
  - Non-technical adoption evidence.
domain_fit:
  ecommerce: 3
  engineering: 5
  consumer_feedback: 2
  data_collection: 5
  ai_tools: 5
access_methods:
  - method_id: repo_search
    description: Search repositories by problem, platform, and implementation shape.
    speed: fast
    reliability: 4
    notes:
      - Do not rank only by stars; check recent commits and Issues.
  - method_id: issues_search
    description: Search open and closed Issues for failures, workarounds, rate limits, captcha, and alternatives.
    speed: medium
    reliability: 5
    notes:
      - Closed Issues often contain the best real workaround.
  - method_id: code_search
    description: Search code for hidden API calls, browser APIs, content scripts, MCP tools, and integration patterns.
    speed: medium
    reliability: 4
    notes:
      - Use when README-level search is too shallow.
  - method_id: pr_discussion_search
    description: Search PRs and Discussions for why an approach changed.
    speed: slow
    reliability: 4
    notes:
      - Useful for judging whether a workaround is still valid.
query_patterns:
  - '"{platform}" "{problem}"'
  - '"{platform}" "workaround"'
  - '"{platform}" "not working"'
  - '"{platform}" "429"'
  - '"{platform}" "captcha"'
  - '"{platform}" "persistent context"'
  - '"{platform}" "chrome extension"'
  - '"{platform}" "content script"'
  - '"{platform}" "MCP server"'
  - '"{platform}" "alternative"'
source_discovery_patterns:
  - 'awesome {domain} github'
  - '{domain} github topic'
  - '{platform} related projects github'
  - '{tool} forks active alternative'
quality_signals:
  strong:
    - Recent commits or releases.
    - Issues include real failures and maintainers respond.
    - Code contains the exact integration path claimed in README.
    - Multiple independent repos converge on the same workaround.
  weak:
    - README-only claims.
    - High stars but no recent maintenance.
    - Empty Issues or disabled Issues.
failure_modes:
  - Star count hides stale projects.
  - Search misses projects that use different names than the user problem.
  - Forks may contain fixes not upstreamed.
maintenance:
  check_frequency: monthly
  last_checked: 2026-08-09
  known_failures: []
history:
  - date: 2026-08-09
    task: Source Scout design
    access_method: repo_search
    result_quality: high
    feedback: GitHub should be treated as multiple access surfaces, not one generic source.

