source_id: standards_sources
name: Standards and Regulatory Sources
source_type: standards_regulatory_source
status: active
priority: 4
best_for:
  - Safety standards, compliance requirements, test methods, and official constraints.
  - Product risk checks and regulated category research.
not_good_for:
  - Informal workaround discovery.
  - Consumer sentiment.
domain_fit:
  ecommerce: 5
  engineering: 3
  consumer_feedback: 1
  data_collection: 1
  ai_tools: 1
access_methods:
  - method_id: standards_search
    description: Search official standards bodies, regulators, and product safety databases.
    speed: medium
    reliability: 5
    notes:
      - Use for high-stakes product and compliance questions.
query_patterns:
  - '{product} safety standard'
  - '{product} ASTM'
  - '{product} CPSC'
  - '{product} EN standard'
source_discovery_patterns:
  - '{category} regulatory database'
quality_signals:
  strong:
    - Official regulator or standards body page.
    - Dated rule, standard, recall, or test method.
  weak:
    - SEO compliance summaries without source links.
failure_modes:
  - Paywalled standards text.
maintenance:
  check_frequency: monthly
  last_checked: 2026-08-09
  known_failures: []
history: []

