source_id: google_search
name: Google Search / General Web Search
source_type: web_search_index
status: active
priority: 4
best_for:
  - Fast source discovery across the open web.
  - Finding indexed forum posts, blogs, directories, docs, and marketplaces.
  - Using search operators to route into specific source types.
not_good_for:
  - Deep GitHub issue/code discovery.
  - Fresh community threads not indexed yet.
  - High-trust conclusions without cross-checking.
domain_fit:
  ecommerce: 4
  engineering: 4
  consumer_feedback: 3
  data_collection: 4
  ai_tools: 4
access_methods:
  - method_id: broad_web_search
    description: Search the open web with query expansion and source-type terms.
    speed: fast
    reliability: 3
    notes:
      - Use to discover source candidates, not as final evidence alone.
  - method_id: site_operator_search
    description: "Route search into known sources with site operators."
    speed: fast
    reliability: 4
    notes:
      - Works well for Reddit, V2EX, Stack Overflow, GitHub, blogs, and docs.
query_patterns:
  - '"{problem}" "{platform}" workaround'
  - '"{problem}" "{platform}" alternative'
  - 'site:github.com "{platform}" "{problem}"'
  - 'site:reddit.com "{platform}" "{problem}"'
  - 'site:stackoverflow.com "{platform}" "{problem}"'
  - 'site:v2ex.com "{platform}" "{problem}"'
  - '"{domain}" "tools directory"'
  - '"{domain}" "marketplace"'
  - '"{domain}" "awesome"'
source_discovery_patterns:
  - '{domain} tools directory'
  - '{domain} marketplace'
  - '{domain} forum'
  - '{domain} newsletter'
  - '{domain} discord'
  - '{domain} telegram'
quality_signals:
  strong:
    - Search reveals several independent source types.
    - Results include primary sources, issue threads, and user communities.
  weak:
    - Mostly SEO articles and SaaS landing pages.
    - Repeated syndicated content.
failure_modes:
  - Tends to surface generic API/SaaS answers first.
  - Many communities and marketplaces are poorly indexed.
maintenance:
  check_frequency: monthly
  last_checked: 2026-08-09
  known_failures: []
history:
  - date: 2026-08-09
    task: Source Scout design
    access_method: site_operator_search
    result_quality: medium
    feedback: Useful for routing into other sources, insufficient as a standalone search strategy.
