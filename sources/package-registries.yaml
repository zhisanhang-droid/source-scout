source_id: package_registries
name: npm / PyPI
source_type: package_registry
status: active
priority: 4
best_for:
  - Finding unofficial clients, wrappers, scrapers, SDKs, and MCP packages.
  - Estimating ecosystem activity through release date, downloads, dependencies, and issue links.
not_good_for:
  - User pain and business demand.
  - Confirming anti-bot reliability without testing.
domain_fit:
  ecommerce: 3
  engineering: 5
  consumer_feedback: 1
  data_collection: 4
  ai_tools: 4
access_methods:
  - method_id: registry_search
    description: Search npm and PyPI by platform, data type, scraper, API, MCP, and browser terms.
    speed: fast
    reliability: 3
    notes:
      - Always trace package homepage to GitHub and check Issues.
  - method_id: dependency_graph
    description: Follow dependencies and dependents to find maintained forks or wrappers.
    speed: medium
    reliability: 3
    notes:
      - Useful when the visible package is stale.
query_patterns:
  - '{platform} scraper npm'
  - '{platform} unofficial api pypi'
  - '{platform} MCP npm'
  - '{platform} browser automation pypi'
  - '{platform} playwright npm'
source_discovery_patterns:
  - '{domain} npm package'
  - '{domain} pypi package'
  - '{tool} maintained fork'
quality_signals:
  strong:
    - Recent release and active GitHub Issues.
    - Clear examples that match the target workflow.
    - Many downstream dependents.
  weak:
    - No repository link.
    - Unmaintained package with stale dependencies.
failure_modes:
  - Package names can be misleading.
  - Download counts may include bots or transitive installs.
maintenance:
  check_frequency: quarterly
  last_checked: 2026-08-09
  known_failures: []
history:
  - date: 2026-08-09
    task: Source Scout design
    access_method: registry_search
    result_quality: medium
    feedback: Useful for discovery; GitHub follow-up is required before trusting.

